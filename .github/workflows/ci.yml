name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

# Least privilege by default; jobs opt in to anything extra
permissions:
  contents: read

# Cancel superseded runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tags are mutable); Dependabot keeps them current.
jobs:
  build:
    name: Build, test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job runs untrusted PR code (Maven plugins, tests), so it gets read-only access
    permissions:
      contents: read
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # don't leave the token in .git/config

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # caches ~/.m2/repository, keyed on pom.xml hash

      - name: Build and verify (compile, test, coverage check)
        run: ./mvnw -B -ntp verify

      - name: Calculate line coverage
        id: coverage
        # Run even if the coverage gate failed, as long as a report was produced
        if: ${{ !cancelled() && hashFiles('target/site/jacoco/jacoco.csv') != '' }}
        run: |
          # jacoco.csv columns: 8 = LINE_MISSED, 9 = LINE_COVERED
          pct=$(awk -F, 'NR>1 { m+=$8; c+=$9 } END { if (m+c==0) print "0.00"; else printf "%.2f", c*100/(m+c) }' \
            target/site/jacoco/jacoco.csv)
          echo "percentage=${pct}" >> "$GITHUB_OUTPUT"
          echo "### Test coverage: ${pct}% (line, minimum 80%)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  # Separate job: the only one with write access, and it never checks out or runs PR code
  coverage-comment:
    name: Post coverage comment
    needs: build
    # Same-repo PRs only: fork PRs get a read-only token and can't comment
    if: >-
      ${{ !cancelled()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && needs.build.outputs.coverage != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Comment coverage on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          COVERAGE: ${{ needs.build.outputs.coverage }}
          THRESHOLD: "80"
        with:
          script: |
            // Treat the value from the build job as untrusted input
            if (!/^\d{1,3}\.\d{2}$/.test(process.env.COVERAGE)) {
              core.setFailed(`Unexpected coverage value: ${JSON.stringify(process.env.COVERAGE)}`);
              return;
            }
            const coverage = parseFloat(process.env.COVERAGE);
            const threshold = parseFloat(process.env.THRESHOLD);
            const status = coverage >= threshold ? '✅' : '❌';
            const marker = '<!-- retroflow-coverage-report -->';
            const body = [
              marker,
              `## ${status} Test coverage: **${coverage.toFixed(2)}%**`,
              '',
              `Line coverage (JaCoCo). Minimum required: ${threshold}%.`,
              `Full report: the \`jacoco-report\` artifact of [this run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            ].join('\n');

            // Update the existing comment instead of adding a new one on every push
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

