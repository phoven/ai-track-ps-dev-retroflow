spring.application.name=retroflow

# In-memory H2 database — no persistence required between restarts.
# Note: the README claims PostgreSQL. It's wrong. This is the actual config.
spring.datasource.url=jdbc:h2:mem:retroflow;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
# Credentials come from the environment (standards 5.1); the fallbacks are H2's local in-memory defaults.
spring.datasource.username=${RETROFLOW_DB_USERNAME:sa}
spring.datasource.password=${RETROFLOW_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console, handy for local debugging: http://localhost:8080/h2-console
spring.h2.console.enabled=true
